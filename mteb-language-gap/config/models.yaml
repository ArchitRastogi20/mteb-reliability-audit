    tier: medium
    passage_prefix: "passage: "
    query_prefix: "query: "

  - id: perplexity-ai/pplx-embed-v1-0.6b
    params: "596M"
    dim: 1024
    tier: medium
    passage_prefix: ""
    query_prefix: ""
    model_kwargs:
      torch_dtype: "float16"

  - id: microsoft/harrier-oss-v1-0.6b
    params: "596M"
    dim: 1024
    tier: medium
    passage_prefix: ""
    query_prefix: ""

