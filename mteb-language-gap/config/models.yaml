# 20 models for this study evaluation
# tier: maps to batch_size in config/hardware.yaml
# model_kwargs: extra kwargs passed to SentenceTransformer()
models:
  # ── Small (≤200M, encoder) ─────────────────────────────────────────
  - id: intfloat/multilingual-e5-small
    params: "118M"
    dim: 384
    tier: small
    passage_prefix: "passage: "
    query_prefix: "query: "

  - id: intfloat/e5-small-v2
    params: "33M"
    dim: 384
    tier: small
    passage_prefix: "passage: "
    query_prefix: "query: "

  - id: ibm-granite/granite-embedding-107m-multilingual
    params: "107M"
    dim: 768
    tier: small
    passage_prefix: ""
    query_prefix: ""

  - id: jinaai/jina-embeddings-v5-text-nano
    params: "212M"
    dim: 1024
    tier: small
    passage_prefix: ""
    query_prefix: ""
    model_kwargs:
      default_task: retrieval

  # ── Medium (200M–700M, encoder) ────────────────────────────────────
  - id: intfloat/multilingual-e5-base
    params: "278M"
    dim: 768
    tier: medium
    passage_prefix: "passage: "
    query_prefix: "query: "

  - id: intfloat/multilingual-e5-large
    params: "560M"
    dim: 1024
    tier: medium
    passage_prefix: "passage: "
    query_prefix: "query: "

  - id: intfloat/multilingual-e5-large-instruct
    params: "560M"
    dim: 1024
    tier: medium
    passage_prefix: ""
    query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "

  - id: BAAI/bge-m3
    params: "568M"
    dim: 1024
    tier: medium
    passage_prefix: ""
    query_prefix: ""

  - id: jinaai/jina-embeddings-v3
    params: "572M"
    dim: 1024
    tier: medium
    passage_prefix: ""
    query_prefix: ""
    model_kwargs:
      low_cpu_mem_usage: false
    tokenizer_kwargs:
      fix_mistral_regex: true
    corpus_encode_kwargs:
      task: "retrieval.passage"
    query_encode_kwargs:
      task: "retrieval.query"

  - id: Snowflake/snowflake-arctic-embed-l-v2.0
    params: "568M"
    dim: 1024
    tier: medium
    passage_prefix: ""
    query_prefix: "Represent this sentence for searching relevant passages: "

  - id: intfloat/e5-large-v2
